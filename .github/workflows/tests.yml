name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Tests mock every Claude call. The client only needs *a* key to start.
      ANTHROPIC_API_KEY: dummy-key-for-ci
      JWT_SECRET_KEY: ci-only-secret

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (same as Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch (much smaller than the default CUDA build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Hugging Face embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Create folders that are gitignored but needed at runtime
        run: mkdir -p logs data

      - name: Run tests
        run: python -m pytest -q
